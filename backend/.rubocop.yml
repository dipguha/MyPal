require:
  - rubocop-rails

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "config/**/*"
    - "db/migrate/**/*"
    - "db/schema.rb"
    - "vendor/**/*"
    - "tmp/**/*"
    - "storage/**/*"

# API app — pragmatic relaxations.
Style/Documentation:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
Metrics/MethodLength:
  Max: 30
Metrics/AbcSize:
  Max: 30

# `is_hmg?` matches the access-control domain term (`is_hmg` column/param).
Naming/PredicatePrefix:
  AllowedMethods:
    - is_hmg?

# Command services (confirm/resend) legitimately return true on success.
Naming/PredicateMethod:
  Enabled: false

# Keyword-argument constructors read clearly even past 5 args.
Metrics/ParameterLists:
  CountKeywordArgs: false

# RSpec describe/factory blocks are legitimately long.
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

# The generated rails_helper uses abort for env/schema guards.
Rails/Exit:
  Exclude:
    - "spec/rails_helper.rb"
