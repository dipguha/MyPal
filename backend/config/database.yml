# PostgreSQL. Connection is driven entirely by environment URLs so the same
# config works in Docker, CI, and deployed environments. See docker-compose.yml
# (local) and backend/.env. ADR-001/ADR-015.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") %>

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL") %>

production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") %>
